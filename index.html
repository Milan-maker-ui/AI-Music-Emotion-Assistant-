<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Music Emotion Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

<div class="container">
    <div class="glass-card">
        <h1>🎵 AI Music Emotion Assistant</h1>
        <p class="subtitle">
            Detect emotions from text and receive
            music recommendations.
        </p>
        <form id="emotionForm">
            <textarea
                id="text"
                name="text"
                placeholder="Type something here..."
                required>
            </textarea>
            <button type="submit">
                Analyze Emotion
            </button>
        </form>
        <div id="loading">
            <div class="spinner"></div>
            <p>Analyzing...</p>
        </div>
    </div>

    <div id="results" class="glass-card hidden">
        <h2>Prediction Result</h2>
        <div class="emotion-box">
            <h3 id="emotion"></h3>
        </div>

        <div class="section">
            <h3>Translated Text</h3>
            <p id="translatedText"></p>
        </div>

        <div class="section">
            <h3>AI Assistant Reply</h3>
            <p id="botReply"></p>
        </div>

        <div class="section">
            <h3>Music Recommendations</h3>
            <ul id="songs"></ul>
        </div>

        <div class="section">
            <h3>Confidence Scores</h3>
            <div id="confidenceBars"></div>
        </div>

        <div class="section">
            <h3>Emotion Distribution</h3>
            <canvas id="emotionChart"></canvas>
        </div>
    </div>
</div>

<script src="{{ url_for('static',
filename='charts.js') }}"></script>

</body>
</html>
